<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Awning Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Awning Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0C2340"/>
      <stop offset="100%" stop-color="#08182B"/>
    </linearGradient>

    <!-- Growth Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Door Interior Gradient -->
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Group: Centered Emblem Icon -->
  <g transform="translate(160, 30)">
    <!-- Top Roof Cap -->
    <rect x="25" y="10" width="230" height="15" rx="7.5" fill="#0C2340"/>

    <!-- Awning Striped Canopy with 5 Scallops -->
    <!-- Scallop 1 (Left - Teal) -->
    <path d="M 35 25 L 75 25 L 75 68 C 75 79 35 79 35 68 Z" fill="url(#tealGrad)"/>
    <!-- Scallop 2 (Navy) -->
    <path d="M 75 25 L 120 25 L 120 68 C 120 79 75 79 75 68 Z" fill="url(#navyGrad)"/>
    <!-- Scallop 3 (Center - Teal) -->
    <path d="M 120 25 L 165 25 L 165 68 C 165 79 120 79 120 68 Z" fill="url(#tealGrad)"/>
    <!-- Scallop 4 (Navy) -->
    <path d="M 165 25 L 205 25 L 205 68 C 205 79 165 79 165 68 Z" fill="url(#navyGrad)"/>
    <!-- Scallop 5 (Right - Teal) -->
    <path d="M 205 25 L 245 25 L 245 68 C 245 79 205 79 205 68 Z" fill="url(#tealGrad)"/>

    <!-- Awning Bottom Shadow Lip -->
    <path d="M 33 25 L 247 25 L 253 60 L 27 60 Z" fill="none" opacity="0.1"/>

    <!-- Storefront Building Base Structure (Deep Navy) -->
    <path d="M 45 78 L 235 78 L 235 156 C 235 160 231 164 227 164 L 53 164 C 49 164 45 160 45 156 Z" fill="#0C2340"/>

    <!-- Door Opening on Left -->
    <rect x="68" y="94" width="46" height="70" rx="8" fill="url(#doorGrad)"/>
    <!-- Door Outline/Frame Highlight -->
    <rect x="65" y="91" width="52" height="73" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Door Glass Diagonal Reflection Highlight -->
    <path d="M 92 94 L 114 94 L 88 164 L 68 164 Z" fill="#FFFFFF" opacity="0.18"/>

    <!-- Analytics Rising Bar Chart on Right -->
    <!-- Bar 1 (Short) -->
    <rect x="140" y="128" width="19" height="36" rx="5" fill="#0D9488"/>
    <!-- Bar 2 (Medium) -->
    <rect x="169" y="112" width="19" height="52" rx="5" fill="#0D9488"/>
    <!-- Bar 3 (Tall) -->
    <rect x="198" y="96" width="19" height="68" rx="5" fill="#0D9488"/>

    <!-- Upward Growth Sweep with Arrow -->
    <!-- White Cutout Mask Behind Arrow -->
    <path d="M 116 142 C 145 140 180 120 220 80 L 210 70 L 236 68 L 234 94 L 224 84 C 182 126 145 148 116 150 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Emerald Growth Arrow -->
    <path d="M 120 141 C 150 138 182 118 222 82" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round"/>
    <polygon points="220,70 238,68 236,86" fill="#10B981"/>
  </g>

  <!-- Typography: SHAFAF HISAB -->
  <text x="300" y="275" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" text-anchor="middle" font-weight="900" font-size="44" letter-spacing="1">
    <tspan fill="#0C2340">SHAFAF </tspan>
    <tspan fill="#0F766E">HISAB</tspan>
  </text>

  <!-- Subtitle Tagline with Accent Stripes: BUSINESS MANAGEMENT PLATFORM -->
  <g transform="translate(300, 312)">
    <!-- Left Accent Line -->
    <line x1="-240" y1="-5" x2="-180" y2="-5" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <!-- Subtitle Text -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" text-anchor="middle" font-weight="700" font-size="13" fill="#0C2340" letter-spacing="3.5">
      BUSINESS MANAGEMENT PLATFORM
    </text>
    <!-- Right Accent Line -->
    <line x1="180" y1="-5" x2="240" y2="-5" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
